name: e2ee_notes
description: "Storage-independent end-to-end encrypted notes."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.13.0

dependencies:
  cryptography: ^2.9.0
  path: ^1.9.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: any
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  secure_keys:
    path: ../packages/secure_keys
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true
