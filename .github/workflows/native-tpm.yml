name: Native TPM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux TPM libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libtpms0
      - name: Configure
        run: cmake -S packages/hardware_keys/native_test -B build/tpm-tests
      - name: Build
        run: cmake --build build/tpm-tests --config Debug
      - name: Test input validation
        run: ctest --test-dir build/tpm-tests -C Debug --output-on-failure
      - name: Test Linux TPM emulator
        if: runner.os == 'Linux'
        run: |
          test_state=$(mktemp -d)
          build/tpm-tests/tpm_key_store_test "libtpms:$test_state/first" "libtpms:$test_state/second"
